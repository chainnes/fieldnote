[project]
name = "fieldnote"
version = "0.1.0"
description = "A human-in-the-loop planning desk that turns meeting notes and email into proposed plan changes."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Charlene Cordero" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
  "pydantic>=2.6",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "langchain-anthropic>=0.3",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
fieldnote = "fieldnote.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fieldnote"]

[tool.hatch.build.targets.wheel.force-include]
"fieldnote/templates" = "fieldnote/templates"
"fieldnote/static" = "fieldnote/static"
"fieldnote/seed" = "fieldnote/seed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
