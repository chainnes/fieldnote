# Render free web service. The container listens on $PORT.
# Leave LLM_PROVIDER=mock to run without a paid key.
# To use a model, set LLM_API_KEY in the Render dashboard, not in this file.
services:
  - type: web
    name: fieldnote
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: mock
      - key: AS_OF_DATE
        value: "2026-03-25"
